<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portal Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms1-user-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 420px;">
    <div class="card">
      <h1>Register</h1>
      <p class="subtitle">Enter your personal details to continue.</p>

      <div id="registerError" class="error"></div>

      <label for = "Username">Username</label>
      <input type = "text" id = "Username" placeholder="Username">

      <label for="Email">Email</label>
      <input type="email" id="Email" placeholder="test@gmail.com">

      <label for="Password">Password</label>
      <input type="password" id="Password">

      <button type="button" onclick="handleRegistration()">Register</button>
      <p class="subtitle">Already have an account? <a href="login.html">Login here</a>.</p>
      <p class="subtitle">Already registered? <a href="registration_confirmation.html">Confirm your email here</a>.</p>
    </div>
  </div>

  <script>
    // If already logged in, skip straight to the dashboard
    if (isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    async function handleRegistration() {
      const errorBox = document.getElementById("registerError");
      errorBox.classList.remove("visible");

      const email = document.getElementById("Email").value;
      const password = document.getElementById("Password").value;
      const User_picture = "https://d39ya09ujvg2cm.cloudfront.net/Images/Base_profile.jpg";
      const prefered_username = document.getElementById("Username").value;

      if (!prefered_username || !email || !password) {
        errorBox.textContent = "All fields are required.";
        errorBox.classList.add("visible");
        return;
      }

      try {
        await UserService.signup({
            email,
            password,
            User_picture,
            prefered_username,
        });
        window.location.href = "registration_confirmation.html";
      } catch (err) {
        errorBox.textContent = err.message || "Registration failed.";
        errorBox.classList.add("visible");
      }
    }
  </script>
</body>
</html>
