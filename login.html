<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portal Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms1-user-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 420px;">
    <div class="card">
      <h1>Sign in</h1>
      <p class="subtitle">Enter your personal details to continue.</p>

      <div id="loginError" class="error"></div>

      <label for = "Username">Username</label>
      <input type = "text" id = "Username" placeholder="Username">

      <label for="Email">Email</label>
      <input type="email" id="Email" placeholder="test@gmail.com">

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword">

      <button type="button" onclick="handleLogin()">Login</button>
      <p class="subtitle">Don't have an account? <a href="register.html">Register here</a>.</p>
    </div>
  </div>

  <script>
    // If already logged in, skip straight to the dashboard
    if (isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    async function handleLogin() {
      const errorBox = document.getElementById("loginError");
      errorBox.classList.remove("visible");

      const email = document.getElementById("Email").value;
      const password = document.getElementById("loginPassword").value;
      const User_picture = "https://tp-reserve.s3.ap-southeast-1.amazonaws.com/Base_profile.jpg";
      const prefered_username = document.getElementById("Username").value;

      if (!prefered_username || !email || !password) {
        errorBox.textContent = "All fields are required.";
        errorBox.classList.add("visible");
        return;
      }

      try {
        await UserService.login(email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Login failed.";
        errorBox.classList.add("visible");
      }
    }
  </script>
</body>
</html>
