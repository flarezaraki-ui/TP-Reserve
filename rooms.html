<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rooms / Areas Available</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms2-room-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 1000px;">
    <div class="topbar">
      <div>
        <h1>Rooms / Areas Available</h1>
        <p class="subtitle">Select a room to view details and book.</p>
      </div>
      <a href="dashboard.html"><button class="secondary">Back to dashboard</button></a>
    </div>
 
    <div id="statusMsg" class="error"></div>
    <div id="roomGrid" class="room-grid">Loading rooms…</div>
  </div>
 
  <script>
    requireLogin();
 
    function statusBadge(capacity) {
      const cap = Number(capacity);
      if (cap <= 0) {
        return `<span class="badge badge-full">Fully booked</span>`;
      }
      return `<span class="badge badge-available">${cap} spot${cap === 1 ? "" : "s"} available</span>`;
    }
 
    function goToRoom(roomId, roomImage) {
      const params = new URLSearchParams({ id: roomId, image: roomImage });
      window.location.href = `reserve_room.html?${params.toString()}`;
    }
 
    function renderRooms(rooms) {
      const roomgrid = document.getElementById("roomGrid");
 
      if (!rooms || rooms.length === 0) {
        roomgrid.innerHTML = "<p>No rooms found.</p>";
        return;
      }
 
      roomgrid.innerHTML = "";
      rooms.forEach(room => {
        const capacity = Number(room.Room_capacity);
        const card = document.createElement("div");
        card.className = "room-card";
        card.style.cursor = "pointer";
        card.onclick = () => goToRoom(room.Room_id, room.Room_image);
        card.innerHTML = `
          <img src="${room.Room_image}" alt="Room ${room.Room_id}" class="room-image" style="object-fit: cover; width: 100px; height: auto; border-radius: 6px;">
          <div class="room-card-body">
            <h3>Room ${room.Room_id}</h3>
            ${statusBadge(capacity)}
          </div>
        `;
        roomgrid.appendChild(card);
      });
    }
 
    async function loadRooms() {
      const statusMsg = document.getElementById("statusMsg");
      try {
        const rooms = await RoomService.listRooms();
        renderRooms(rooms);
      } catch (err) {
        statusMsg.textContent = `Could not load rooms: ${err.message}`;
        statusMsg.classList.add("visible");
      }
    }
 
    loadRooms();
  </script>
</body>
</html>
