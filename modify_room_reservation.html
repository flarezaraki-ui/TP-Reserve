<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modify Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms2-room-service.js"></script>
  <script src="js/ms4-reservation-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 500px;">
    <a href="dashboard.html"><button class="secondary" style="margin-bottom:20px;">&larr; Back to dashboard</button></a>

    <div id="loadError" class="error"></div>

    <div class="card" id="formCard" style="display:none;">
      <h1 id="formTitle">Display Booking</h1>
      <div id="roomName"></div>
      <div id="formError" class="error"></div>

      <div id="roomOnlyFields" style="display:none;">
        <label for="bookingDatetime">Date &amp; time</label>
        <input type="datetime-local" id="bookingDatetime">

        <label for="bookingDuration">Duration (hours)</label>
        <input type="number" id="bookingDuration" min="1">
      </div>

      <label for="bookingPax">Number of people</label>
      <input type="number" id="bookingPax" min="1">

      <div style="display:flex; gap:10px;">
        <button type="button" onclick="saveChanges()">Save Changes</button>
        <button type="button" class="secondary" style="background:var(--danger); color:white; border:none;" onclick="cancelBooking()">Cancel Booking</button>
      </div>
    </div>
  </div>

  <script>
    requireLogin();

    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get("id");

    async function loadRoomname(room_id) {
      try {
        const results = await RoomService.getRoom(room_id);
        console.log("Room details:", results);

        // Updated to target array index [0]
        const roomName = results[0]?.Room_name || "Unknown Room";
        document.getElementById("roomName").innerHTML = `<h1> Room Name : ${roomName}</h1>`; 
      } catch (err) {
        console.error("Failed to load room name:", err);
        return [];
      }
    }

    async function loadBooking() {
      const loadError = document.getElementById("loadError");

      if (!bookingId) {
        loadError.textContent = "Missing or invalid booking information in the URL.";
        loadError.classList.add("visible");
        return;
      }

      try {
        const response = await ReservationService.getReservation(bookingId);
        const booking = response.details && response.details[0];

        if (!booking) {
          loadError.textContent = "Booking not found.";
          loadError.classList.add("visible");
          return;
        }

        document.getElementById("formTitle").textContent = `Modify Room Booking #${booking.Room_booking_id}`;
        document.getElementById("roomOnlyFields").style.display = "block";

        const datetimeForInput = booking.Room_datetime.replace(" ", "T").slice(0, 16);
        document.getElementById("bookingDatetime").value = datetimeForInput;
        document.getElementById("bookingDuration").value = booking.Room_duration;
        document.getElementById("bookingPax").value = booking.Pax_count;
        console.log(booking.Room_id);
        await loadRoomname(booking.Room_id);

        document.getElementById("formCard").style.display = "block";
      } catch (err) {
        loadError.textContent = `Could not load booking: ${err.message}`;
        loadError.classList.add("visible");
      }
    }

    async function saveChanges() {
      const errorBox = document.getElementById("formError");
      errorBox.classList.remove("visible");

      const pax = document.getElementById("bookingPax").value;
      if (!pax) {
        errorBox.textContent = "Number of people is required.";
        errorBox.classList.add("visible");
        return;
      }

      try {
        const datetimeRaw = document.getElementById("bookingDatetime").value;
        const duration = document.getElementById("bookingDuration").value;

        if (!datetimeRaw || !duration) {
          errorBox.textContent = "All fields are required.";
          errorBox.classList.add("visible");
          return;
        }

        const roomDatetime = datetimeRaw.replace("T", " ") + ":00";

        await ReservationService.updateReservation({
          Room_booking_id: bookingId,
          Room_datetime: roomDatetime,
          Room_duration: Number(duration),
          Pax_count: Number(pax)
        });

        window.location.href = "dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Save failed.";
        errorBox.classList.add("visible");
      }
    }

    async function cancelBooking() {
      if (!confirm("Cancel this booking? This cannot be undone.")) return;

      try {
        await ReservationService.cancelReservation(bookingId);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert(`Cancel failed: ${err.message}`);
      }
    }

    loadBooking();
  </script>
</body>
</html>
