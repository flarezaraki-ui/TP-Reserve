<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modify Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms3-event-service.js"></script>
  <script src="js/ms4-reservation-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 500px;">
    <a href="dashboard.html"><button class="secondary" style="margin-bottom:20px;">&larr; Back to dashboard</button></a>

    <div id="loadError" class="error"></div>

    <div class="card" id="formCard" style="display:none;">
      <h1 id="formTitle">Display Booking</h1>
      <div id="eventName"></div>
      <div id="formError" class="error"></div>

      <label for="bookingPax">Number of people</label>
      <input type="number" id="bookingPax" min="1">

      <div style="display:flex; gap:10px;">
        <button type="button" onclick="saveChanges()">Save Changes</button>
        <button type="button" class="secondary" style="background:var(--danger); color:white; border:none;" onclick="cancelBooking()">Cancel Booking</button>
      </div>
    </div>
  </div>

  <script>
    requireLogin();

    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get("id");

    async function loadEventname(event_id) {
      try {
        const results = await EventService.getEvent(event_id);
        console.log("Event details:", results);

        // Updated to target array index [0]
        const eventName = results[0]?.Event_name || "Unknown Event";
        document.getElementById("eventName").innerHTML = `<h1> Event Name : ${eventName}</h1>`; 
      } catch (err) {
        console.error("Failed to load event name:", err);
        return [];
      }
    }

    async function loadBooking() {
      const loadError = document.getElementById("loadError");

      if (!bookingId) {
        loadError.textContent = "Missing or invalid booking information in the URL.";
        loadError.classList.add("visible");
        return;
      }

      try {
        const response = await ReservationService.getEventReservation(bookingId);
        const booking = response.details && response.details[0];

        if (!booking) {
          loadError.textContent = "Booking not found.";
          loadError.classList.add("visible");
          return;
        }

        document.getElementById("formTitle").textContent = `Modify Event Booking #${booking.Event_booking_id}`;
       


        document.getElementById("bookingPax").value = booking.Pax_count;
        await loadEventname(booking.Event_id);

        document.getElementById("formCard").style.display = "block";
      } catch (err) {
        loadError.textContent = `Could not load booking: ${err.message}`;
        loadError.classList.add("visible");
      }
    }

    async function saveChanges() {
      const errorBox = document.getElementById("formError");
      errorBox.classList.remove("visible");

      const pax = document.getElementById("bookingPax").value;
      if (!pax) {
        errorBox.textContent = "Number of people is required.";
        errorBox.classList.add("visible");
        return;
      }

      try {

        await ReservationService.updateEventReservation({
          Event_booking_id: bookingId,
          Pax_count: Number(pax)
        });

        window.location.href = "dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Save failed.";
        errorBox.classList.add("visible");
      }
    }

    async function cancelBooking() {
      if (!confirm("Cancel this booking? This cannot be undone.")) return;

      try {
        await ReservationService.cancelEventReservation(bookingId);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert(`Cancel failed: ${err.message}`);
      }
    }

    loadBooking();
  </script>
</body>
</html>
