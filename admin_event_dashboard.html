<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Manage Events</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms3-event-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 900px;">
    <div class="topbar">
      <div>
        <h1>Manage Events</h1>
        <p class="subtitle">Add, edit, or remove events.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="create_event.html"><button>Add Event</button></a>
        <a href="dashboard.html"><button class="secondary">Back to dashboard</button></a>
      </div>
    </div>
 
    <div id="statusMsg" class="error"></div>
    <div id="eventList">Loading events…</div>
  </div>
 
  <script>
    requireLogin();
 
    function goToEdit(event) {
      const params = new URLSearchParams({ id: event.Event_id, image: event.Event_image });
      window.location.href = `edit_event.html?${params.toString()}`;
    }
 
    function renderEvents(events) {
      const list = document.getElementById("eventList");
 
      if (!events || events.length === 0) {
        list.innerHTML = "<p>No events yet.</p>";
        return;
      }
 
      list.innerHTML = "";
      events.forEach(event => {
        const row = document.createElement("div");
        row.className = "card";
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.alignItems = "center";
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px;">
            <img src="${event.Event_image}" style="width:60px; height:60px; object-fit:cover; border-radius:6px;">
            <div>
              <strong>${event.Event_name || `Event ${event.Event_id}`}</strong><br>
              <span style="color:#5b6478; font-size:0.85rem;">${event.Event_location || ""} &middot; Capacity ${event.Event_capacity}</span>
            </div>
          </div>
          <button type="button" class="editBtn">Edit</button>
        `;
        row.querySelector(".editBtn").onclick = () => goToEdit(event);
        list.appendChild(row);
      });
    }
 
    async function loadEvents(){
      const statusMsg = document.getElementById("statusMsg");
      try {
        const events = await EventService.listEvents();
        renderEvents(events);
      } catch (err) {
        statusMsg.textContent = `Could not load events: ${err.message}`;
        statusMsg.classList.add("visible");
      }
    }
    loadEvents();
  </script>
</body>
</html>
