<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Event</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms3-event-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 500px;">
    <a href="admin_event_dashboard.html"><button class="secondary" style="margin-bottom:20px;">&larr; Back to events</button></a>

    <div id="loadError" class="error"></div>

    <div class="card" id="editCard" style="display:none;">
      <h1 id="formTitle">Edit Event</h1>
      <div id="formError" class="error"></div>


      <label>Event ID</label>
      <input type="text" id="eventId" disabled>

      <label>Event Image URL</label>
      <input type="text" id="eventImage" disabled>

      <label for="eventName">Event Name</label>
      <input type="text" id="eventName">

      <label for="eventLocation">Location</label>
      <input type="text" id="eventLocation">

      <label for="eventDescription">Description</label>
      <input type="text" id="eventDescription">

      <label for="eventCapacity">Capacity</label>
      <input type="number" id="eventCapacity" min="0">

      <label for="eventDate">Date-Time</label>
      <input type="datetime-local" id="eventDate">

      <label for="eventDuration">Duration (in hours)</label>
      <input type="number" id="eventDuration" min="0">

      <div style="display:flex; gap:10px;">
        <button type="button" onclick="saveChanges()">Save Changes</button>
        <button type="button" class="secondary" style="background:var(--danger); color:white; border:none;" onclick="deleteThisEvent()">Delete Event</button>
      </div>
    </div>
  </div>

  <script>
    requireLogin();

    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("id");
    const eventImage = params.get("image");

    async function loadEvent() {
      const loadError = document.getElementById("loadError");

      if (!eventId || !eventImage) {
        loadError.textContent = "Missing event information in the URL.";
        loadError.classList.add("visible");
        return;
      }

      try {
        const results = await EventService.getEvent(eventId);
        const match = results.find(e => e.Event_image === eventImage);

        if (!match) {
          loadError.textContent = "Could not find this specific event item.";
          loadError.classList.add("visible");
          return;
        }

        document.getElementById("formTitle").textContent = `Editing Event ${match.Event_id}`;
        document.getElementById("eventId").value = match.Event_id;
        document.getElementById("eventImage").value = match.Event_image;
        document.getElementById("eventName").value = match.Event_name || "";
        document.getElementById("eventLocation").value = match.Event_location || "";
        document.getElementById("eventDescription").value = match.Event_description || "";
        document.getElementById("eventCapacity").value = match.Event_capacity ?? "";
        document.getElementById("eventDate").value = match.Event_datetime ? match.Event_datetime.slice(0, 16) : "";
        document.getElementById("eventDuration").value = match.Event_duration ?? "";

        document.getElementById("editCard").style.display = "block";
      } catch (err) {
        loadError.textContent = `Could not load event: ${err.message}`;
        loadError.classList.add("visible");
      }
    }

    async function saveChanges() {
      const errorBox = document.getElementById("formError");
      errorBox.classList.remove("visible");

      const event = {
        Event_id: eventId,
        Event_image: eventImage,
        Event_name: document.getElementById("eventName").value.trim(),
        Event_location: document.getElementById("eventLocation").value.trim(),
        Event_description: document.getElementById("eventDescription").value.trim(),
        Event_capacity: Number(document.getElementById("eventCapacity").value),
        Event_datetime: String(document.getElementById("eventDate").value + ":00Z"),
        Event_duration: Number(document.getElementById("eventDuration").value)
      };

      try {
        await EventService.updateEvent(event);
        window.location.href = "admin_event_dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Save failed.";
        errorBox.classList.add("visible");
      }
    }

    async function deleteThisEvent() {
      if (!confirm(`Delete Event ${eventId}? This cannot be undone.`)) return;

      try {
        await EventService.deleteEvent(eventId, eventImage);
        window.location.href = "admin_event_dashboard.html";
      } catch (err) {
        alert(`Delete failed: ${err.message}`);
      }
    }

    loadEvent();
  </script>
</body>
</html>
