<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Room</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms2-room-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 500px;">
    <a href="admin_room_dashboard.html"><button class="secondary" style="margin-bottom:20px;">&larr; Back to rooms</button></a>

    <div class="card">
      <h1>Add a new room</h1>
      <div id="formError" class="error"></div>

      <label for="roomId">Room ID</label>
      <input type="text" id="roomId">

      <label for="roomImage">Room Image URL</label>
      <input type="text" id="roomImage">

      <label for="roomName">Room Name</label>
      <input type="text" id="roomName">

      <label for="roomLocation">Location</label>
      <input type="text" id="roomLocation">

      <label for="roomDescription">Description</label>
      <input type="text" id="roomDescription">

      <label for="roomCapacity">Capacity</label>
      <input type="number" id="roomCapacity" min="0">

      <button type="button" onclick="createRoom()">Create Room</button>
    </div>
  </div>

  <script>
    requireLogin();

    async function createRoom() {
      const errorBox = document.getElementById("formError");
      errorBox.classList.remove("visible");

      const room = {
        Room_id: document.getElementById("roomId").value.trim(),
        Room_image: document.getElementById("roomImage").value.trim(),
        Room_name: document.getElementById("roomName").value.trim(),
        Room_location: document.getElementById("roomLocation").value.trim(),
        Room_description: document.getElementById("roomDescription").value.trim(),
        Room_capacity: Number(document.getElementById("roomCapacity").value)
      };

      if (!room.Room_id || !room.Room_image) {
        errorBox.textContent = "Room ID and Room Image are both required.";
        errorBox.classList.add("visible");
        return;
      }

      try {
        await RoomService.createRoom(room);
        window.location.href = "admin_room_dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Create failed.";
        errorBox.classList.add("visible");
      }
    }
  </script>
</body>
</html>
