<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Room</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms2-room-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 500px;">
    <a href="admin_room_dashboard.html"><button class="secondary" style="margin-bottom:20px;">&larr; Back to rooms</button></a>

    <div id="loadError" class="error"></div>

    <div class="card" id="editCard" style="display:none;">
      <h1 id="formTitle">Edit Room</h1>
      <div id="formError" class="error"></div>

      <!-- Room_id and Room_image form the composite key - they can't be
           changed via update, so they're shown but locked. -->
      <label>Room ID</label>
      <input type="text" id="roomId" disabled>

      <label>Room Image URL</label>
      <input type="text" id="roomImage" disabled>

      <label for="roomName">Room Name</label>
      <input type="text" id="roomName">

      <label for="roomLocation">Location</label>
      <input type="text" id="roomLocation">

      <label for="roomDescription">Description</label>
      <input type="text" id="roomDescription">

      <label for="roomCapacity">Capacity</label>
      <input type="number" id="roomCapacity" min="0">

      <div style="display:flex; gap:10px;">
        <button type="button" onclick="saveChanges()">Save Changes</button>
        <button type="button" class="secondary" style="background:var(--danger); color:white; border:none;" onclick="deleteThisRoom()">Delete Room</button>
      </div>
    </div>
  </div>

  <script>
    requireLogin();

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("id");
    const roomImage = params.get("image");

    async function loadRoom() {
      const loadError = document.getElementById("loadError");

      if (!roomId || !roomImage) {
        loadError.textContent = "Missing room information in the URL.";
        loadError.classList.add("visible");
        return;
      }

      try {
        const results = await RoomService.getRoom(roomId);
        const match = results.find(r => r.Room_image === roomImage);

        if (!match) {
          loadError.textContent = "Could not find this specific room item.";
          loadError.classList.add("visible");
          return;
        }

        document.getElementById("formTitle").textContent = `Editing Room ${match.Room_id}`;
        document.getElementById("roomId").value = match.Room_id;
        document.getElementById("roomImage").value = match.Room_image;
        document.getElementById("roomName").value = match.Room_name || "";
        document.getElementById("roomLocation").value = match.Room_location || "";
        document.getElementById("roomDescription").value = match.Room_description || "";
        document.getElementById("roomCapacity").value = match.Room_capacity ?? "";

        document.getElementById("editCard").style.display = "block";
      } catch (err) {
        loadError.textContent = `Could not load room: ${err.message}`;
        loadError.classList.add("visible");
      }
    }

    async function saveChanges() {
      const errorBox = document.getElementById("formError");
      errorBox.classList.remove("visible");

      const room = {
        Room_id: roomId,
        Room_image: roomImage,
        Room_name: document.getElementById("roomName").value.trim(),
        Room_location: document.getElementById("roomLocation").value.trim(),
        Room_description: document.getElementById("roomDescription").value.trim(),
        Room_capacity: Number(document.getElementById("roomCapacity").value)
      };

      try {
        await RoomService.updateRoom(room);
        window.location.href = "admin_room_dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Save failed.";
        errorBox.classList.add("visible");
      }
    }

    async function deleteThisRoom() {
      if (!confirm(`Delete Room ${roomId}? This cannot be undone.`)) return;

      try {
        await RoomService.deleteRoom(roomId, roomImage);
        window.location.href = "admin_room_dashboard.html";
      } catch (err) {
        alert(`Delete failed: ${err.message}`);
      }
    }

    loadRoom();
  </script>
</body>
</html>
