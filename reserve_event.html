<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Details</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ms3-event-service.js"></script>
  <script src="js/ms4-reservation-service.js"></script>
</head>
<body>
  <div class="page" style="max-width: 500px;">
    <a href="events.html"><button class="secondary" style="margin-bottom:20px;">&larr; Back to Events</button></a>

    <div id="loadError" class="error"></div>

    <div id="eventDetail" class="card">Loading Event…</div>

    <div id="bookingSection" class="card" style="display:none;">
      <h2>Book this event</h2>
      <div id="bookingError" class="error"></div>

      <label for="bookingPax">Number of people</label>
      <input type="number" id="bookingPax" min="1" value="1">

      <button type="button" onclick="submitBooking()">Confirm booking</button>
    </div>
  </div>

  <script>
    requireLogin();

    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("id");
    const eventImage = params.get("image");

    let currentEvent = null;

    function statusBadge(capacity) {
      const cap = Number(capacity);
      if (cap <= 0) {
        return `<span class="badge badge-full">Fully booked</span>`;
      }
      return `<span class="badge badge-available">${cap} spot${cap === 1 ? "" : "s"} available</span>`;
    }

    function renderEvent(event) {
      const capacity = Number(event.Event_capacity);
      const dateTimedisplay = event.Event_datetime.replace("T", " ") + ":00";
      document.getElementById("eventDetail").innerHTML = `
        <img src="${event.Event_image}" alt="Event ${event.Event_id}" style="width:100%; border-radius:8px; margin-bottom:16px;">
        <h1>${event.Event_name}</h1>
        <p>${event.Event_location}</p>
        <p>${event.Event_duration}</p>
        <p>${event.Event_datetime}</p>
        <p>${event.Event_description}</p>
        ${statusBadge(capacity)}
      `;

      const bookingSection = document.getElementById("bookingSection");
      if (capacity > 0) {
        bookingSection.style.display = "block";
        document.getElementById("bookingPax").max = capacity;
      } else {
        bookingSection.style.display = "none";
      }
    }

    async function loadEvent() {
      const loadError = document.getElementById("loadError");

      if (!eventId || !eventImage) {
        loadError.textContent = "Missing event information in the URL.";
        loadError.classList.add("visible");
        return;
      }

      try {

        const results = await EventService.getEvent(eventId);
        const match = results.find(e => e.Event_image === eventImage);

        if (!match) {
          loadError.textContent = "Could not find this specific event item.";
          loadError.classList.add("visible");
          return;
        }

        currentEvent = match;
        renderEvent(match);
      } catch (err) {
        loadError.textContent = `Could not load event: ${err.message}`;
        loadError.classList.add("visible");
      }
    }

    async function submitBooking() {
      const errorBox = document.getElementById("bookingError");
      errorBox.classList.remove("visible");

      const session = getSession();
      const userId = session.user.userId;
      const pax = document.getElementById("bookingPax").value;

      if (!userId) {
        errorBox.textContent = "Your session is missing a User ID - please log out and back in.";
        errorBox.classList.add("visible");
        return;
      }

      if (!pax) {
        errorBox.textContent = "Number of people is required.";
        errorBox.classList.add("visible");
        return;
      }

      const reservation = {
          User_id: Number(userId),
          Event_id: currentEvent.Event_id,
          Pax_count: Number(pax),
          Event_image: currentEvent.Event_image || "default-placeholder.png",
      };

      try {
        await ReservationService.createEventReservation(reservation);
        alert("Booking successful! You will be redirected to the events list.");
        window.location.href = "events.html";
      } catch (err) {
        errorBox.textContent = err.message || "Booking failed.";
        errorBox.classList.add("visible");
      }
    }

    loadEvent();
  </script>
</body>
</html>
